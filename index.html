<script>
    // =========================================================================
    // KONFIGURASI API (GANTI DENGAN URL DEPLOYMENT BARU YANG BERAKHIRAN /exec)
    // =========================================================================
    const API_URL = 'MASUKKAN_URL_DEPLOYMENT_ANDA_DISINI';
    
    let currentUser = null; 
    let html5QrcodeScanner = null; 
    let isScanning = false; 
    let audioAktif = false; 
    let lastScan = ""; 
    let jadwalBel = []; 
    let grafikInstance = null;
    const chimeIn = new Audio("https://actions.google.com/sounds/v1/alarms/chime_alarm.ogg"); 
    
    // UPDATE JAM OTOMATIS
    setInterval(() => {
        const now = new Date();
        const elTgl = document.getElementById('header-tanggal');
        const elJam = document.getElementById('header-jam');
        if(elTgl) elTgl.innerText = now.toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'short', day: 'numeric' });
        if(elJam) elJam.innerText = now.toLocaleTimeString('id-ID', { hour12: false });
    }, 1000);

    const showLoad = (txt) => { 
        document.getElementById('load-text').innerText = txt; 
        document.getElementById('loading').classList.remove('hidden'); 
    }
    const hideLoad = () => document.getElementById('loading').classList.add('hidden');
    
    function togglePassword() {
      const p = document.getElementById('password');
      if(p) p.type = p.type === 'password' ? 'text' : 'password';
    }

    // =========================================================================
    // FUNGSI FETCH (MENGGUNAKAN GET AGAR ANTI-CORS GOOGLE)
    // =========================================================================
    async function panggilAPI(dataPayload) {
      try {
        const params = new URLSearchParams(dataPayload).toString();
        const urlFinal = `${API_URL}?${params}`;
        
        const r = await fetch(urlFinal, { method: 'GET', mode: 'cors' }); 
        return await r.json(); 
      } catch (e) { 
        console.error(e);
        return { sukses: false, pesan: "Gagal terhubung ke database. Pastikan URL Deployment benar dan disetel ke 'Anyone'." }; 
      }
    }

    function pindahMenu(menu) {
      if(isScanning) stopKamera();
      document.querySelectorAll('.view-panel').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('nav-active'));
      
      const targetView = document.getElementById('view-' + menu);
      const targetNav = document.getElementById('nav-' + menu);
      if(targetView) targetView.classList.remove('hidden');
      if(targetNav) targetNav.classList.add('nav-active');
      
      const judulMap = { 'dashboard': 'Dashboard Sistem', 'scan': 'Kamera & Alat Presensi', 'rekap': 'Laporan Absensi', 'pengaturan': 'Pengaturan Sistem' };
      const elJudul = document.getElementById('judul-halaman');
      if(elJudul && judulMap[menu]) elJudul.innerText = judulMap[menu];

      if(menu === 'dashboard') muatDashboard();
    }

    // =========================================================================
    // FUNGSI UTAMA (LOGIN, DASHBOARD, SCAN, REKAP)
    // =========================================================================
    async function prosesLogin() {
      const u = document.getElementById('username').value;
      const p = document.getElementById('password').value;
      
      if(!u || !p) return Swal.fire('Perhatian', 'Isi username & password', 'warning');
      
      showLoad("Mengecek Kredensial...");
      const res = await panggilAPI({ action: "login", user: u, pass: p });
      hideLoad();
      
      if(res.sukses) {
        currentUser = res.data; 
        document.getElementById('login-view').classList.add('hidden'); 
        document.getElementById('app-layout').classList.remove('hidden');
        
        const uiUser = document.getElementById('user-info');
        if(uiUser) uiUser.innerText = `${currentUser.nama} (${currentUser.peran})`; 
        
        const setNama = document.getElementById('set-nama');
        const setUser = document.getElementById('set-user');
        if(setNama) setNama.value = currentUser.nama;
        if(setUser) setUser.value = currentUser.username;

        // Ambil jadwal bel
        panggilAPI({ action: "bel" }).then(r => { if(r.sukses) jadwalBel = r.data; }); 
        
        pindahMenu('dashboard');
      } else {
        Swal.fire('Akses Ditolak', res.pesan, 'error');
      }
    }

    async function muatDashboard() {
      showLoad("Menarik Statistik..."); 
      const res = await panggilAPI({ action: "dashboard" });
      hideLoad();
      
      if(res.sukses) {
        document.getElementById('dash-guru').innerText = res.guru;
        document.getElementById('dash-siswa').innerText = res.siswa;
        document.getElementById('dash-hadir').innerText = res.hadir;
        
        renderGrafik(res.grafik.label, res.grafik.data);
        
        const tabelUtama = document.getElementById('tabel-utama');
        if(tabelUtama) {
            tabelUtama.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-gray-500 text-xs italic">Menampilkan statistik (Daftar nama tidak dimuat di mode ini).</td></tr>`;
        }
      } else {
        Swal.fire('Error', res.pesan, 'error');
      }
    }

    function renderGrafik(labelsArray, dataArray) {
      const elCtx = document.getElementById('chartKehadiran');
      if(!elCtx) return;
      const ctx = elCtx.getContext('2d');
      if (grafikInstance) grafikInstance.destroy(); 
      grafikInstance = new Chart(ctx, {
        type: 'line',
        data: { labels: labelsArray, datasets: [{ label: 'Total Kehadiran', data: dataArray, borderColor: '#10b981', backgroundColor: 'rgba(16, 185, 129, 0.1)', borderWidth: 3, tension: 0.4, fill: true, pointBackgroundColor: '#047857' }] },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, grid: { borderDash: [4, 4] } }, x: { grid: { display: false } } } }
      });
    }

    function mulaiKamera() {
      document.getElementById('btn-start').classList.add('hidden');
      document.getElementById('btn-stop').classList.remove('hidden');
      html5QrcodeScanner = new Html5Qrcode("reader");
      isScanning = true;
      html5QrcodeScanner.start(
        { facingMode: "environment" }, 
        { fps: 10, qrbox: { width: 250, height: 250 } },
        async (decodedText) => {
            if(lastScan !== decodedText) {
                lastScan = decodedText;
                const sesi = document.getElementById('sesi-absen').value;
                showLoad("Memproses Absen...");
                const r = await panggilAPI({ action: "scan", qr: decodedText, sesi: sesi, pemindai: currentUser.username });
                hideLoad();
                
                if(r.sukses) Swal.fire('Berhasil', `${r.data.nama} - ${r.pesan} (${r.data.waktu})`, 'success');
                else Swal.fire('Gagal', r.pesan, 'error');
                
                setTimeout(() => { lastScan = ""; }, 4000); 
            }
        },
        (errorMessage) => {}
      ).catch((err) => {
        Swal.fire('Error Kamera', 'Kamera tidak ditemukan atau akses ditolak.', 'error');
        stopKamera();
      });
    }

    function stopKamera() {
      if(html5QrcodeScanner) {
        html5QrcodeScanner.stop().then(() => { html5QrcodeScanner.clear(); isScanning = false; }).catch(err => console.log(err));
      }
      document.getElementById('btn-start').classList.remove('hidden');
      document.getElementById('btn-stop').classList.add('hidden');
    }

    async function handleScanFisik(event) {
        if(event.key === 'Enter') {
            const val = event.target.value;
            const sesi = document.getElementById('sesi-absen').value;
            
            showLoad("Menyimpan...");
            const r = await panggilAPI({ action: "scan", qr: val, sesi: sesi, pemindai: currentUser.username });
            hideLoad();
            
            if(r.sukses) Swal.fire('Berhasil', `${r.data.nama} - ${r.pesan} (${r.data.waktu})`, 'success');
            else Swal.fire('Gagal', r.pesan, 'error');
            
            event.target.value = '';
        }
    }

    function aturFormLaporan() {
      const jns = document.getElementById('jenis-laporan').value;
      if(jns === 'harian') { 
          document.getElementById('form-harian').classList.remove('hidden'); 
          document.getElementById('form-bulanan').classList.add('hidden'); 
      } else { 
          document.getElementById('form-harian').classList.add('hidden'); 
          document.getElementById('form-bulanan').classList.remove('hidden'); 
      }
    }

    async function tarikDataRekap() {
      const tglMulai = document.getElementById('tgl-mulai').value;
      const tglSelesai = document.getElementById('tgl-selesai').value;
      
      if(!tglMulai || !tglSelesai) return Swal.fire('Info', 'Isi tanggal mulai dan selesai.', 'warning');
      
      showLoad("Menarik Rekap...");
      const res = await panggilAPI({ action: "rekap", tglMulai: tglMulai, tglSelesai: tglSelesai });
      hideLoad();
      
      const tbody = document.getElementById('tabel-rekap');
      tbody.innerHTML = "";
      
      if(res.sukses) {
        if(res.data.length === 0) return tbody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-gray-500">Tidak ada data di tanggal tersebut.</td></tr>`;
        
        res.data.forEach(d => {
          let badge = d.status === "HADIR" ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700';
          tbody.innerHTML += `<tr>
            <td class="p-4 border-b">${d.tanggal} <br><span class="text-xs text-gray-500">${d.waktu}</span></td>
            <td class="p-4 border-b font-mono text-sm">${d.idOrang}</td>
            <td class="p-4 border-b font-bold">${d.idOrang} <br><span class="font-normal text-xs text-gray-500">Tipe: ${d.tipe}</span></td>
            <td class="p-4 border-b"><span class="px-2 py-1 rounded text-xs font-bold ${badge}">${d.status}</span></td>
            <td class="p-4 border-b font-bold text-gray-700">${d.sesi}</td>
          </tr>`;
        });
      } else {
        Swal.fire('Error', res.pesan, 'error');
      }
    }

    function cetakLaporanPDF() {
      Swal.fire('Info', 'Gunakan fitur print browser dengan menekan Ctrl+P pada halaman ini.', 'info');
    }

    function toggleAudioAI() {
      audioAktif = !audioAktif;
      const btn = document.getElementById('btn-audio-bg');
      const sts = document.getElementById('status-teks-bel');
      if(audioAktif) {
        btn.innerText = "MATIKAN BEL"; 
        btn.className = "bg-red-500 hover:bg-red-600 text-white font-bold px-6 py-2.5 rounded-lg shadow-md transition text-sm";
        sts.innerHTML = 'Bel otomatis saat ini <b class="text-green-600">AKTIF</b>.';
        chimeIn.play();
      } else {
        btn.innerText = "AKTIFKAN BEL SEKARANG"; 
        btn.className = "bg-yellow-500 hover:bg-yellow-600 text-yellow-950 font-bold px-6 py-2.5 rounded-lg shadow-md transition text-sm";
        sts.innerHTML = 'Bel otomatis saat ini <b class="text-red-500">NONAKTIF</b>.';
      }
    }
</script>
